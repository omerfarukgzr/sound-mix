<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="İlk açılışta çıkan “Sound Mix.app Açılmadı” uyarısında Bitti'ye bas">
<title>İlk açılışta çıkan “Sound Mix.app Açılmadı” uyarısında Bitti'ye bas</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: #f6f8fa; }
  .win { fill: #ffffff; stroke: #d0d7de; }
  .bar { fill: #f2f2f4; }
  .side { fill: #f2f2f4; }
  .line { stroke: #e3e3e8; }
  .t1 { fill: #1f2328; }
  .t2 { fill: #6e7781; }
  .sel { fill: #dbe7fb; }
  .btn2 { fill: #e8e8ed; }
  .doc { fill: #ffffff; stroke: #b9bec6; }
  .mark { stroke: #e5484d; fill: none; }
  .markfill { fill: #e5484d; }
  .accent { fill: #0a84ff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .win { fill: #2a2a2d; stroke: #44464b; }
    .bar, .side { fill: #333337; }
    .line { stroke: #44464b; }
    .t1 { fill: #f0f3f6; }
    .t2 { fill: #9198a1; }
    .sel { fill: #2f4a73; }
    .btn2 { fill: #48484d; }
    .doc { fill: #3a3a3e; stroke: #6b6f76; }
    .mark { stroke: #ff6369; }
    .markfill { fill: #ff6369; }
  }
</style>
<rect class="bg" width="660" height="330" rx="12"/>
<rect class="win" x="190" y="20" width="280" height="290" rx="16"/>
<image href="data:image/png;base64," x="214" y="44" width="52" height="52"/>
<path d="M256 76 l14 24 h-28 z" fill="#ffcc00" stroke="#8a6d00" stroke-width="1"/>
<text x="256" y="97" font-size="14" font-weight="800" fill="#4a3a00" text-anchor="middle">!</text>
<text class="t1" x="214" y="132" font-size="13" font-weight="700">“Sound Mix.app” Açılmadı</text>
<text class="t1" x="214" y="154" font-size="11.5">Apple, “Sound Mix.app” öğesinin Mac’inize</text>
<text class="t1" x="214" y="170" font-size="11.5">zarar verebilecek veya gizliliğinizi ihlal</text>
<text class="t1" x="214" y="186" font-size="11.5">edebilecek bir kötü amaçlı yazılım</text>
<text class="t1" x="214" y="202" font-size="11.5">içermediğini doğrulayamadı.</text>
<rect class="accent" x="210" y="222" width="240" height="30" rx="15"/>
<text x="330.0" y="242" font-size="13" fill="#fff" text-anchor="middle">Çöp Sepeti’ne Taşı</text>
<rect class="btn2" x="210" y="262" width="240" height="30" rx="15"/>
<text class="t1" x="330.0" y="282" font-size="13" text-anchor="middle">Bitti</text>
<rect class="mark" x="204" y="256" width="252" height="42" rx="21" stroke-width="2.5"/>
<circle class="markfill" cx="500" cy="277" r="12"/><text x="500" y="281.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text class="t1" x="520" y="282" font-size="13" font-weight="600">Bitti’ye bas</text>
<text class="t2" x="170" y="234" font-size="12" text-anchor="end">Buna basma,</text>
<text class="t2" x="170" y="250" font-size="12" text-anchor="end">uygulamayı siler</text>
</svg>
